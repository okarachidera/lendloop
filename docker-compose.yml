services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-local-encryption-key}
      - LENDLOOP_N8N_SECRET=${N8N_SHARED_SECRET:-replace-me}
      - CONVEX_HTTP_BASE_URL=${CONVEX_HTTP_BASE_URL:-http://host.docker.internal:3211}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-replace-me}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
